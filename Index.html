    function renderCriticalList(items) {
      items = safeArray(items);
      return `<div class="list">${items.length ? items.map(item => `
        <div class="list-item urgent"><strong>${escapeHtml(item.studentName)}</strong><div>${escapeHtml(item.category + ' – ' + item.skill)}</div><div class="muted small">${escapeHtml(item.subjectName)}</div></div>`).join('')
        : '<div class="empty">No benchmarks are marked critical.</div>'}</div>`;
    }

    function renderTimeEntries(pay) {
      pay = pay || { entries: [], daysOff: [] };
      pay.entries = safeArray(pay.entries);
      pay.daysOff = safeArray(pay.daysOff);
      if (!pay.entries.length && !pay.daysOff.length) return '<div class="empty">No tracked records in this pay period.</div>';
      return `<div class="list" style="margin-top:16px">
        ${pay.entries.map(item => `<div class="metric"><span>${escapeHtml(item.clockIn)}</span><strong>${item.hours == null ? 'Open' : escapeHtml(String(item.hours)) + ' hrs'}</strong></div>`).join('')}
        ${pay.daysOff.map(item => `<div class="metric"><span>${escapeHtml(item.startDate)}–${escapeHtml(item.endDate)} · ${escapeHtml(item.type)}</span><strong>Off</strong></div>`).join('')}
      </div>`;
    }

    function renderProgressChart(progress, rootId) {
      const root = document.getElementById(rootId || 'progressChart');
      if (!root) return;
      const points = safeArray(progress && progress.points);
      if (!points.length) {
        root.innerHTML = '<div class="empty">No entries have been recorded for this benchmark.</div>';
        return;
      }
      const width = 760, height = 310, left = 46, right = 20, top = 20, bottom = 62;
      const plotBottom = height - bottom;
      const x = index => points.length === 1 ? (left + width - right) / 2 : left + index * ((width - left - right) / (points.length - 1));
      const y = value => plotBottom - (Number(value || 0) / 100) * (plotBottom - top);
      const line = points.map((point, index) => `${x(index)},${y(point.percent)}`).join(' ');
      const labelEvery = Math.max(1, Math.ceil(points.length / 7));
      const grid = [0, 25, 50, 75, 100].map(value => `
        <line x1="${left}" y1="${y(value)}" x2="${width-right}" y2="${y(value)}" stroke="rgba(255,255,255,.08)"/>
        <text x="8" y="${y(value)+4}" fill="#8f9299" font-size="11">${value}%</text>`).join('');
      root.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Benchmark progress line chart">
        ${grid}<polyline points="${line}" fill="none" stroke="#e10600" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        ${points.map((point, index) => `<circle cx="${x(index)}" cy="${y(point.percent)}" r="5" fill="#fff" stroke="#e10600" stroke-width="3"><title>${escapeHtml(formatChartDate(point.timestamp))}: ${escapeHtml(String(point.percent))}% (${escapeHtml(String(point.correct))}/${escapeHtml(String(point.attempts))})</title></circle>`).join('')}
        ${points.map((point, index) => (index % labelEvery === 0 || index === points.length - 1)
          ? `<text x="${x(index)}" y="${height - 28}" fill="#aeb0b5" font-size="11" text-anchor="middle">${escapeHtml(formatChartDate(point.timestamp))}</text>`
          : '').join('')}
      </svg>`;
    }

    async function loadGoalWorkspace(studentId, force) {
      const workspace = document.getElementById('goalWorkspace');
      if (!workspace || !studentId) return;
      try {
        workspace.innerHTML = '<div class="empty">Loading student goals…</div>';
        const data = !force && state.goalWorkspaceCache[studentId]
          ? state.goalWorkspaceCache[studentId]
          : await server('getStudentGoalWorkspace', studentId);
        state.goalWorkspaceCache[studentId] = data;
        renderGoalWorkspaceData(data);
      } catch (error) {
        workspace.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function renderGoalWorkspaceData(data) {
      const goals = safeArray(data && data.goals);
      const workspace = document.getElementById('goalWorkspace');
      const chart = document.getElementById('goalProgressChart');
      const legend = document.getElementById('goalLegend');
      if (!workspace || !chart || !legend) return;
      renderGoalProgressChart(goals, chart, legend);
      workspace.innerHTML = goals.length ? goals.map((goal, goalIndex) => {
        const metrics = goal.metrics || {};
        const benchmarks = safeArray(goal.benchmarks);
        return `
          <div class="goal-card">
            <div class="row" style="justify-content:space-between;align-items:flex-start">
              <div><div class="eyebrow">Goal ${goalIndex + 1}</div><h3>${escapeHtml(goal.goal)}</h3></div>
              <div class="row">
                ${goal.critical ? '<span class="chip critical">Critical</span>' : ''}
                <span class="chip">${escapeHtml(goal.startDate)}–${escapeHtml(goal.dueDate)}</span>
              </div>
            </div>
            <div class="checks">${safeArray(goal.subjectNames).map(name => `<span class="chip">${escapeHtml(name)}</span>`).join('')}</div>
            <div class="checks">
              <span class="chip">Latest ${metrics.latestPercent == null ? '—' : escapeHtml(String(metrics.latestPercent)) + '%'}</span>
              <span class="chip">Average ${metrics.averagePercent == null ? '—' : escapeHtml(String(metrics.averagePercent)) + '%'}</span>
              <span class="chip">${escapeHtml(String(metrics.entryCount || 0))} entries</span>
              <span class="chip">Trend ${metrics.trend == null ? '—' : (metrics.trend > 0 ? '+' : '') + escapeHtml(String(metrics.trend)) + '%'}</span>
            </div>
            <div class="toolbar">
              <button class="btn ${goal.critical ? 'ghost' : 'danger'} small-btn" data-goal-critical="${escapeAttr(goal.id)}" data-critical="${goal.critical ? 'false' : 'true'}">${goal.critical ? 'Remove critical status' : 'Mark goal critical'}</button>
            </div>
            <div class="list">${benchmarks.length ? benchmarks.map(benchmark => `
              <div class="benchmark-row ${benchmark.active ? 'active' : ''}">
                <button class="btn ghost" style="text-align:left" data-benchmark-history="${escapeAttr(benchmark.id)}">
                  <strong>${escapeHtml(benchmark.category)}</strong>
                  <div class="muted small">${escapeHtml(benchmark.skill)}</div>
                </button>
                ${benchmark.active
                  ? '<span class="chip status-approved">Active</span>'
                  : `<button class="btn small-btn" data-set-active="${escapeAttr(benchmark.id)}" data-goal-id="${escapeAttr(goal.id)}">Make active</button>`}
              </div>`).join('') : '<div class="empty">No benchmarks are assigned to this goal.</div>'}</div>
          </div>`;
      }).join('') : '<div class="empty">This student has no active annual goals.</div>';
      workspace.querySelectorAll('[data-set-active]').forEach(button => button.addEventListener('click', async () => {
        try {
          await server('setActiveGoalBenchmark', {
            goalId: button.dataset.goalId,
            benchmarkId: button.dataset.setActive
          });
          state.goalWorkspaceCache[state.goalStudentId] = null;
          await loadGoalWorkspace(state.goalStudentId, true);
          const benchmark = state.data.caseManager.benchmarks.find(item =>
            String(item.id) === String(button.dataset.setActive)
          );
          state.data.caseManager.benchmarks
            .filter(item => String(item.goalId) === String(button.dataset.goalId))
            .forEach(item => { item.active = benchmark ? item.id === benchmark.id : false; });
          toast('Active objective updated.');
        } catch (error) { toast(error.message, true); }
      }));
      workspace.querySelectorAll('[data-benchmark-history]').forEach(button =>
        button.addEventListener('click', () => showBenchmarkHistory(button.dataset.benchmarkHistory))
      );
      workspace.querySelectorAll('[data-goal-critical]').forEach(button => button.addEventListener('click', async () => {
        try {
          const critical = button.dataset.critical === 'true';
          await server('setGoalCritical', {
            goalId: button.dataset.goalCritical,
            critical
          });
          const managedGoal = state.data.caseManager.goals.find(goal =>
            String(goal.id) === String(button.dataset.goalCritical)
          );
          if (managedGoal) managedGoal.critical = critical;
          state.data.caseManager.benchmarks
            .filter(benchmark => String(benchmark.goalId) === String(button.dataset.goalCritical))
            .forEach(benchmark => { benchmark.critical = critical; });
          state.goalWorkspaceCache[state.goalStudentId] = null;
          await loadGoalWorkspace(state.goalStudentId, true);
          toast(critical ? 'Goal marked critical.' : 'Critical status removed.');
        } catch (error) { toast(error.message, true); }
      }));
    }

    function renderGoalProgressChart(goals, chart, legend) {
      const colors = ['#ff453a', '#64d2ff', '#ffd60a', '#bf5af2', '#30d158', '#ff9f0a', '#5e5ce6', '#ff375f'];
      const series = goals.map((goal, index) => ({
        goal,
        color: colors[index % colors.length],
        points: safeArray(goal.points).map(point => ({
          ...point,
          time: new Date(point.timestamp).getTime()
        })).filter(point => Number.isFinite(point.time))
      }));
      const allPoints = series.flatMap(item => item.points);
      legend.innerHTML = series.map((item, index) => `
        <span class="goal-legend-item">
          <span class="goal-legend-dot" style="background:${item.color}"></span>
          Goal ${index + 1}: ${escapeHtml(item.goal.goal)}
        </span>`).join('');
      if (!allPoints.length) {
        chart.innerHTML = '<div class="empty">No entries have been recorded for this student’s goals.</div>';
        return;
      }
      const width = 980, height = 340, left = 48, right = 24, top = 24, bottom = 62;
      const plotBottom = height - bottom;
      const minTime = Math.min(...allPoints.map(point => point.time));
      const maxTime = Math.max(...allPoints.map(point => point.time));
      const x = time => minTime === maxTime
        ? (left + width - right) / 2
        : left + ((time - minTime) / (maxTime - minTime)) * (width - left - right);
      const y = value => plotBottom - (Number(value || 0) / 100) * (plotBottom - top);
      const grid = [0, 25, 50, 75, 100].map(value => `
        <line x1="${left}" y1="${y(value)}" x2="${width-right}" y2="${y(value)}" stroke="rgba(255,255,255,.08)"/>
        <text x="8" y="${y(value)+4}" fill="#8f9299" font-size="11">${value}%</text>`).join('');
      const dateTicks = Array.from({ length: 5 }, (_, index) =>
        minTime + (maxTime - minTime) * (index / 4)
      );
      chart.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Annual goal progress line chart">
        ${grid}
        ${series.map(item => {
          const line = item.points.map(point => `${x(point.time)},${y(point.percent)}`).join(' ');
          return `<polyline points="${line}" fill="none" stroke="${item.color}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            ${item.points.map(point => `<circle cx="${x(point.time)}" cy="${y(point.percent)}" r="4" fill="#111318" stroke="${item.color}" stroke-width="3"><title>${escapeHtml(formatChartDate(point.timestamp))}: ${escapeHtml(String(point.percent))}%</title></circle>`).join('')}`;
        }).join('')}
        ${dateTicks.map((time, index) => `<text x="${x(time)}" y="${height - 28}" fill="#aeb0b5" font-size="11" text-anchor="${index === 0 ? 'start' : index === 4 ? 'end' : 'middle'}">${escapeHtml(formatChartDate(new Date(time).toISOString()))}</text>`).join('')}
      </svg>`;
    }

    async function showBenchmarkHistory(benchmarkId) {
      const dialog = document.getElementById('benchmarkHistoryDialog');
      const content = document.getElementById('benchmarkHistoryContent');
      content.innerHTML = '<div class="empty">Loading entries…</div>';
      dialog.showModal();
      try {
        const data = state.benchmarkEntryCache[benchmarkId] ||
          await server('getBenchmarkEntryDetails', benchmarkId);
        state.benchmarkEntryCache[benchmarkId] = data;
        document.getElementById('benchmarkHistoryTitle').textContent =
          data.benchmark.category + ' · ' + data.benchmark.studentName;
        const entries = safeArray(data.entries);
        content.innerHTML = entries.length ? `<div class="list">${entries.map(entry => `
          <div class="list-item">
            <div class="row" style="justify-content:space-between">
              <strong>${escapeHtml(String(entry.correct))}/${escapeHtml(String(entry.attempts))}</strong>
              <span class="chip">${escapeHtml(String(entry.percent))}%</span>
            </div>
            <div class="muted small">${escapeHtml(formatEntryDateTime(entry.timestamp))} · ${escapeHtml(entry.staffName)}</div>
            <div style="margin-top:8px">${entry.notes ? escapeHtml(entry.notes) : '<span class="muted">No notes entered.</span>'}</div>
          </div>`).join('')}</div>` : '<div class="empty">No entries have been recorded for this benchmark.</div>';
      } catch (error) {
        content.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    async function refreshBootstrap(tab) {
      const nextData = normalizeBootstrap(await server('getAppBootstrap'));
      state.data = nextData;
      state.goalWorkspaceCache = {};
      state.benchmarkEntryCache = {};
      document.getElementById('brandLogo').src = state.data.logo || '';
      document.getElementById('welcomeName').textContent = 'Welcome ' + (state.data.user.firstName || '');
      document.getElementById('roleChip').textContent = roleLabel(state.data.user.role);
      if (state.data.view === 'CASE_MANAGER') {
        if (tab) state.selectedTab = tab;
        document.getElementById('aideView').classList.add('hidden');
        renderCaseManager();
      } else {
        document.getElementById('caseManagerView').classList.add('hidden');
        document.getElementById('aideView').innerHTML = '';
        renderAide();
      }
    }

    function bindRefreshButtons(root) {
      (root || document).querySelectorAll('[data-refresh]').forEach(button => {
        if (button.dataset.refreshBound) return;
        button.dataset.refreshBound = 'true';
        button.addEventListener('click', async () => {
          try {
            const section = button.dataset.refresh || state.selectedTab;
            if (section === 'benchmarks') {
              await refreshGoalManagerData();
            } else if (section === 'admin') {
              await refreshMessageManagementData();
            } else if (section === 'overview') {
              await refreshBootstrap('overview');
            } else {
              await refreshBootstrap(section);
            }
            toast('Data refreshed.');
          } catch (error) { toast(safeErrorMessage(error), true); }
        });
      });
    }

    function formObject(form) {
      return Object.fromEntries(new FormData(form).entries());
    }

    function server(functionName, ...args) {
      beginBusy(operationLabel(functionName));
      return new Promise((resolve, reject) => {
        try {
          google.script.run
            .withSuccessHandler(result => {
              endBusy();
              if (result === null || result === undefined) {
                reject(new Error('No response was returned. Refresh this view and try again.'));
                return;
              }
              resolve(result);
            })
            .withFailureHandler(error => {
              endBusy();
              reject(new Error(safeErrorMessage(error)));
            })
            [functionName](...args);
        } catch (error) {
          endBusy();
          reject(new Error(safeErrorMessage(error)));
        }
      });
    }

    function beginBusy(message) {
      state.pendingOperations += 1;
      const overlay = document.getElementById('busyOverlay');
      document.getElementById('busyMessage').textContent = message || 'Working…';
      if (state.data || document.getElementById('loading').classList.contains('done')) {
        overlay.classList.remove('hidden');
      }
      document.querySelector('main').inert = true;
      document.querySelectorAll('dialog').forEach(dialog => { dialog.inert = true; });
      document.body.setAttribute('aria-busy', 'true');
    }

    function endBusy() {
      state.pendingOperations = Math.max(0, state.pendingOperations - 1);
      if (state.pendingOperations) return;
      document.getElementById('busyOverlay').classList.add('hidden');
      document.querySelector('main').inert = false;
      document.querySelectorAll('dialog').forEach(dialog => { dialog.inert = false; });
      document.body.removeAttribute('aria-busy');
    }

    function operationLabel(functionName) {
      const labels = {
        getAppBootstrap: 'Refreshing app data…',
        lookupBenchmarks: 'Finding benchmarks…',
        saveBenchmarkEntry: 'Saving benchmark input…',
        getBenchmarkProgress: 'Loading progress history…',
        getStudentGoalWorkspace: 'Loading student goals…',
        getBenchmarkEntryDetails: 'Loading benchmark entries…',
        createGoal: 'Creating annual goal…',
        setActiveGoalBenchmark: 'Updating active benchmark…',
        setGoalCritical: 'Updating goal priority…',
        deactivateGoal: 'Deactivating goal…',
        getGoalManagerData: 'Refreshing goals…',
        saveDailyMessage: 'Saving global message…',
        setDailyMessageActive: 'Updating global message…',
        getMessageManagementData: 'Refreshing messages…',
        getScheduleBuilderData: 'Loading schedule…',
        getWeeklyScheduleData: 'Loading weekly schedule…',
        getAideWeek: 'Loading Weekly View…',
        previewWeeklyHours: 'Calculating weekly hours…',
        saveSchedule: 'Saving schedule…',
        saveScheduleType: 'Saving schedule type…',
        upsertStaff: 'Saving staff member…',
        deleteStaff: 'Removing staff access…',
        upsertStudent: 'Saving student…',
        deleteStudent: 'Deactivating student…',
        reviewStaffRequest: 'Updating request…',
        generateIep: 'Generating IEP document…',
        saveBrandingLogo: 'Uploading logo…'
      };
      return labels[functionName] || 'Working with the database…';
    }

    function options(items, valueKey, labelKey, selected) {
      return safeArray(items).map(item => `<option value="${escapeAttr(item && item[valueKey])}" ${String(item && item[valueKey]) === String(selected || '') ? 'selected' : ''}>${escapeHtml(item && item[labelKey])}</option>`).join('');
    }

    function toast(message, isError) {
      const element = document.getElementById('toast');
      element.textContent = safeErrorMessage(message);
      element.className = 'toast show' + (isError ? ' error' : '');
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => element.className = 'toast', 5000);
    }

    function showFatal(error) {
      const root = document.getElementById('fatalError');
      root.classList.remove('hidden');
      root.innerHTML = `<div class="eyebrow">Unable to initialize</div><h2>V.O.I.C.E.S 2.0 could not open</h2><p>${escapeHtml(safeErrorMessage(error))}</p><p class="muted">Ask a case manager or the Apps Script owner to confirm database setup, deployment access, and the Staff whitelist.</p>`;
    }

    function safeArray(value) { return Array.isArray(value) ? value : []; }
    function normalizeEmail(value) { return String(value || '').trim().toLowerCase(); }
    function normalizeBootstrap(value) {
      if (!value || typeof value !== 'object' || !value.user || !value.view) {
        throw new Error('The database returned an incomplete response.');
      }
      value.dailyMessages = safeArray(value.dailyMessages);
      value.criticalBenchmarks = safeArray(value.criticalBenchmarks);
      value.classes = safeArray(value.classes);
      value.students = safeArray(value.students);
      value.subjects = safeArray(value.subjects);
      value.benchmarkLookup = value.benchmarkLookup || {};
      value.benchmarkLookup.teachers = safeArray(value.benchmarkLookup.teachers);
      value.benchmarkLookup.classes = safeArray(value.benchmarkLookup.classes).map(item =>
        Object.assign({}, item || {}, { students: safeArray(item && item.students) })
      );
      if (value.aide) {
        value.aide.schedule = value.aide.schedule || {};
        value.aide.schedule.periods = safeArray(value.aide.schedule.periods);
        value.aide.schedule.assignments = safeArray(value.aide.schedule.assignments);
        value.aide.trainedStudents = safeArray(value.aide.trainedStudents);
        value.aide.currentPayPeriod = value.aide.currentPayPeriod || {};
        value.aide.currentPayPeriod.entries = safeArray(value.aide.currentPayPeriod.entries);
        value.aide.currentPayPeriod.daysOff = safeArray(value.aide.currentPayPeriod.daysOff);
      } else if (value.view !== 'CASE_MANAGER') {
        value.aide = {
          schedule: { periods: [], assignments: [] },
          trainedStudents: [],
          openTimeEntry: null,
          currentPayPeriod: { entries: [], daysOff: [], totalHours: 0 }
        };
      }
      if (value.caseManager) {
        ['students', 'goals', 'benchmarks', 'iepReminders', 'toDos', 'staff', 'caseManagers', 'aides', 'scheduleTypes']
          .forEach(key => { value.caseManager[key] = safeArray(value.caseManager[key]); });
        value.caseManager.messages = value.caseManager.messages || {};
        value.caseManager.messages.messages = safeArray(value.caseManager.messages.messages);
        value.caseManager.messages.activeToday = safeArray(value.caseManager.messages.activeToday);
        value.caseManager.requests = value.caseManager.requests || {};
        value.caseManager.requests.pending = safeArray(value.caseManager.requests.pending);
        value.caseManager.requests.timeOffHistory = safeArray(value.caseManager.requests.timeOffHistory);
        value.caseManager.requests.currentAvailability = safeArray(value.caseManager.requests.currentAvailability);
      }
      return value;
    }
    function safeErrorMessage(value) {
      if (value && typeof value === 'object' && value.message) return String(value.message);
      const text = String(value == null ? '' : value).trim();
      return text && text !== '[object Object]' ? text : 'Something went wrong. Refresh this view and try again.';
    }
    function formatChartDate(value) {
      const text = String(value || '');
      const date = new Date(text);
      if (Number.isNaN(date.getTime())) return text.slice(0, 10);
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    function formatEntryDateTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value || '');
      return date.toLocaleString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    }

    function openDialog(id) {
      const dialog = document.getElementById(id);
      const today = state.data ? state.data.today : '';
      dialog.querySelectorAll('input[type="date"]').forEach(input => { if (!input.value) input.value = today; });
      dialog.showModal();
    }
    function closeDialog(id) { document.getElementById(id).close(); }
    function fileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    function roleLabel(role) { return titleCase(String(role).replace('_', ' ')); }
    function titleCase(value) { return String(value).toLowerCase().replace(/\b\w/g, char => char.toUpperCase()); }
    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function escapeAttr(value) { return escapeHtml(value); }
  </script>
</body>
</html>
