<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090b;
      --panel: rgba(25, 27, 31, .84);
      --panel-strong: #1a1c20;
      --panel-soft: #111318;
      --border: rgba(255, 255, 255, .09);
      --text: #f7f7f8;
      --muted: #a6a8ad;
      --red: #e10600;
      --red-soft: rgba(225, 6, 0, .14);
      --green: #48c78e;
      --amber: #f4b942;
      --radius: 22px;
      --shadow: 0 18px 50px rgba(0, 0, 0, .32);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(225, 6, 0, .12), transparent 30%),
        radial-gradient(circle at 90% 15%, rgba(255, 255, 255, .04), transparent 28%),
        var(--bg);
      color: var(--text);
      font: 15px/1.45 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: grid;
      place-items: center;
      background: #050607;
      transition: opacity .4s ease, visibility .4s ease;
    }
    .loading.done { opacity: 0; visibility: hidden; }
    .loading-inner { text-align: center; }
    .loading-logo {
      width: 150px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(225, 6, 0, .25));
      animation: pulse 2.6s ease-in-out infinite;
    }
    .loading-title {
      margin-top: 22px;
      font-size: 14px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #d5d6d8;
    }
    .loading-dots::after {
      content: "";
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(.97); filter: drop-shadow(0 0 7px rgba(225, 6, 0, .22)); }
      50% { transform: scale(1.035); filter: drop-shadow(0 0 26px rgba(225, 6, 0, .72)); }
    }
    @keyframes dots {
      0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; }
    }
    .shell { max-width: 1500px; margin: 0 auto; padding: 22px; }
    .topbar {
      position: sticky;
      top: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(13, 14, 17, .78);
      backdrop-filter: blur(24px);
      box-shadow: var(--shadow);
    }
    .brand, .user-block, .toolbar, .row { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 58px; height: 42px; object-fit: contain; }
    .brand strong { font-size: 17px; letter-spacing: .08em; }
    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .welcome { font-size: 14px; text-align: right; }
    .role-chip, .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.03);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .chip.critical { color: #ffb4b0; border-color: rgba(225,6,0,.35); background: var(--red-soft); }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 18px;
      padding: 5px;
      width: max-content;
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.025);
    }
    .tab {
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      padding: 9px 14px;
    }
    .tab.active { background: #2a2c32; color: white; }
    .grid { display: grid; gap: 18px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .span-2 { grid-column: span 2; }
    .card {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(31,33,38,.9), rgba(18,20,24,.9));
      box-shadow: var(--shadow);
    }
    .card.red-tint { background: linear-gradient(145deg, rgba(73,14,15,.65), rgba(21,19,23,.92)); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
    }
    .card h2, .card h3, .card p { margin-top: 0; }
    .card h2 { margin-bottom: 4px; font-size: 18px; }
    .card h3 { margin-bottom: 6px; font-size: 15px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .hero-value { margin: 8px 0 3px; font-size: clamp(24px, 4vw, 40px); font-weight: 750; letter-spacing: -.035em; }
    .assignment-title { font-size: 24px; font-weight: 750; }
    .message {
      margin: 0 0 10px;
      padding: 14px;
      border-left: 3px solid var(--red);
      border-radius: 5px 14px 14px 5px;
      background: rgba(255,255,255,.035);
    }
    .message-meta { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .list { display: grid; gap: 10px; }
    .list-item {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.025);
    }
    .list-item.urgent { border-color: rgba(225,6,0,.5); background: var(--red-soft); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    label { color: #d8d9dc; font-size: 12px; font-weight: 650; }
    input, select, textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: 0;
      background: #111318;
      color: var(--text);
      padding: 10px 12px;
    }
    input:focus, select:focus, textarea:focus { border-color: rgba(225,6,0,.75); box-shadow: 0 0 0 3px rgba(225,6,0,.12); }
    textarea { min-height: 90px; resize: vertical; }
    input[type="checkbox"], input[type="radio"] { width: auto; min-height: auto; accent-color: var(--red); }
    .checks { display: flex; flex-wrap: wrap; gap: 8px; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #111318;
    }
    .btn {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #25272d;
      color: white;
      padding: 9px 14px;
      font-weight: 700;
    }
    .btn:hover { transform: translateY(-1px); background: #30323a; }
    .btn.primary { border-color: #ff2b25; background: var(--red); }
    .btn.ghost { background: transparent; }
    .btn.danger { color: #ffaaa7; background: var(--red-soft); border-color: rgba(225,6,0,.35); }
    .btn.small-btn { min-height: 32px; padding: 6px 10px; font-size: 12px; }
    .btn:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: .55; }
    .busy-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      place-items: center;
      background: rgba(5, 6, 7, .66);
      backdrop-filter: blur(4px);
    }
    .busy-card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: min(360px, calc(100vw - 32px));
      padding: 17px 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #1a1c20;
      box-shadow: var(--shadow);
    }
    .spinner {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      border: 3px solid rgba(255,255,255,.18);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .benchmark-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 18px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.025);
    }
    .benchmark-card + .benchmark-card { margin-top: 12px; }
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .schedule-strip { display: grid; gap: 8px; }
    .schedule-row {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .schedule-row:last-child { border-bottom: 0; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 16px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 800px; }
    th, td { min-width: 190px; padding: 10px; vertical-align: top; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    th { position: sticky; top: 0; z-index: 2; background: #202228; text-align: left; font-size: 12px; }
    th:first-child, td:first-child { position: sticky; left: 0; z-index: 3; min-width: 160px; background: #17191e; }
    .schedule-scroll-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .schedule-x-scroll {
      height: 18px;
      overflow-x: auto;
      overflow-y: hidden;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #111318;
    }
    .schedule-x-scroll-track { height: 1px; }
    .schedule-table-wrap {
      max-height: min(68vh, 760px);
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    .schedule-table-wrap table { width: max-content; min-width: 100%; }
    .schedule-table-wrap thead th {
      top: 0;
      z-index: 5;
      box-shadow: 0 2px 0 rgba(255,255,255,.12);
      white-space: nowrap;
    }
    .schedule-table-wrap thead th:first-child { z-index: 7; }
    .schedule-table-wrap tbody td:first-child { z-index: 4; }
    .schedule-assignment-cell.blocked { background: rgba(225, 6, 0, .1); }
    .schedule-assignment-cell.warning { background: rgba(244, 185, 66, .08); }
    .schedule-cell-alert {
      padding: 7px 8px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
    }
    .schedule-cell-alert.blocked { color: #ffb4b0; border-color: rgba(225,6,0,.4); background: rgba(225,6,0,.13); }
    .schedule-cell-alert.warning { color: #ffd887; border-color: rgba(244,185,66,.4); background: rgba(244,185,66,.1); }
    .schedule-header-hours { margin-top: 5px; color: #fff; font-size: 11px; font-weight: 750; }
    .schedule-aide-off { margin-top: 7px; }
    .coverage-assistant { display: grid; gap: 10px; }
    .coverage-assistant-item {
      display: grid;
      gap: 8px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.025);
    }
    .coverage-assistant-item.blocked { border-color: rgba(225,6,0,.42); background: rgba(225,6,0,.08); }
    .replacement-options { display: flex; flex-wrap: wrap; gap: 7px; }
    .schedule-cell { display: grid; gap: 7px; }
    .schedule-cell input, .schedule-cell select { min-height: 34px; padding: 6px 8px; font-size: 12px; }
    .period-editor { display: grid; gap: 8px; }
    .period-editor input { min-height: 34px; padding: 6px 8px; }
    .week-bar { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); gap: 8px; overflow-x: auto; }
    .week-day {
      display: grid;
      gap: 4px;
      min-width: 110px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255,255,255,.025);
      color: var(--text);
      text-align: left;
    }
    .week-day.active { border-color: rgba(225,6,0,.8); background: var(--red-soft); }
    .week-day strong { font-size: 13px; }
    .week-day span { color: var(--muted); font-size: 11px; }
    .capacity-rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 9px; }
    .capacity-item { padding: 12px; border: 1px solid var(--border); border-radius: 13px; background: rgba(255,255,255,.025); }
    .capacity-item.over { border-color: rgba(225,6,0,.55); background: var(--red-soft); }
    .capacity-item .hours { font-size: 19px; font-weight: 750; }
    .week-day-schedule { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .week-day-schedule summary { cursor: pointer; padding: 13px; background: rgba(255,255,255,.035); font-weight: 700; }
    .week-day-schedule[open] summary { border-bottom: 1px solid var(--border); }
    .week-day-schedule .schedule-strip { padding: 0 13px; }
    .chart {
      min-height: 270px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #0f1115;
      overflow: hidden;
    }
    .chart svg { width: 100%; height: 270px; }
    .metric { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .metric:last-child { border-bottom: 0; }
    .section-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .master-detail { display: grid; grid-template-columns: minmax(300px, .85fr) minmax(0, 1.4fr); gap: 18px; }
    .scroll-list { max-height: 720px; overflow: auto; padding-right: 4px; }
    .objective-preview, .goal-card { display: grid; gap: 12px; }
    .objective-preview { padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,255,255,.025); }
    .goal-card { padding: 16px; border: 1px solid var(--border); border-radius: 16px; background: rgba(255,255,255,.025); }
    .benchmark-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #111318;
    }
    .benchmark-row.active { border-color: rgba(72,199,142,.45); }
    .goal-legend { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
    .goal-legend-item { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .goal-legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .mobile-cm-note { display: none; }
    .status-approved { color: #9ef0c7; border-color: rgba(72,199,142,.35); }
    .status-denied { color: #ffaaa7; border-color: rgba(225,6,0,.35); }
    .status-pending { color: #ffd887; border-color: rgba(244,185,66,.35); }
    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 1200;
      max-width: 420px;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #25272d;
      box-shadow: var(--shadow);
      transform: translateY(30px);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-color: rgba(225,6,0,.6); background: #461719; }
    dialog {
      width: min(680px, calc(100vw - 30px));
      max-height: 90vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: #15171b;
      color: var(--text);
      padding: 22px;
      box-shadow: 0 30px 90px #000;
    }
    dialog.wide-dialog { width: min(1000px, calc(100vw - 30px)); }
    dialog::backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(5px); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    @media (max-width: 900px) {
      .grid.two, .grid.three, .form-grid.three { grid-template-columns: 1fr; }
      .master-detail { grid-template-columns: 1fr; }
      .span-2 { grid-column: auto; }
      .benchmark-card { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; }
      .desktop-cm-only { display: none !important; }
      .mobile-cm-note { display: block; }
    }
    @media (max-width: 620px) {
      .shell { padding: 12px; }
      .form-grid { grid-template-columns: 1fr; }
      .topbar .brand strong { display: none; }
      .welcome { max-width: 190px; }
      .card { padding: 16px; border-radius: 18px; }
      .toolbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="loading-inner">
      <img id="loadingLogo" class="loading-logo" src="<?!= defaultLogo ?>" alt="V.O.I.C.E.S logo">
      <div class="loading-title">V.O.I.C.E.S 2.0 Initializing<span class="loading-dots"></span></div>
    </div>
  </div>

  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img id="brandLogo" src="<?!= defaultLogo ?>" alt="">
        <div>
          <strong>V.O.I.C.E.S 2.0</strong>
          <div class="eyebrow">Westminster High School</div>
        </div>
      </div>
      <div class="user-block">
        <button id="globalRefresh" class="btn ghost small-btn" type="button">Refresh</button>
        <div class="welcome">
          <div id="welcomeName">Welcome</div>
          <span id="roleChip" class="role-chip"></span>
        </div>
      </div>
    </header>

    <div id="fatalError" class="card red-tint hidden"></div>
    <section id="aideView" class="hidden"></section>
    <section id="caseManagerView" class="hidden"></section>
  </main>

  <div id="toast" class="toast"></div>
  <div id="busyOverlay" class="busy-overlay hidden" role="status" aria-live="polite">
    <div class="busy-card"><span class="spinner"></span><div><strong id="busyMessage">Working…</strong><div class="muted small">Please wait. Controls are temporarily locked.</div></div></div>
  </div>

  <dialog id="callOffDialog">
    <div class="card-header">
      <div><div class="eyebrow">Staff absence</div><h2>Call off</h2></div>
      <button class="btn ghost small-btn" onclick="closeDialog('callOffDialog')">Close</button>
    </div>
    <form id="callOffForm" class="form-grid">
      <div class="field"><label>First date</label><input name="startDate" type="date" required></div>
      <div class="field"><label>Last date</label><input name="endDate" type="date" required></div>
      <div class="field">
        <label>Call-off type</label>
        <select name="type" required>
          <option value="">Choose type</option><option>Sick</option><option>Personal business</option>
          <option>Family emergency</option><option>Bereavement</option><option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Do you have enough hours?</label>
        <div class="checks">
          <label class="check"><input type="radio" name="hasHours" value="true" required> Yes</label>
          <label class="check"><input type="radio" name="hasHours" value="false"> No</label>
        </div>
      </div>
      <div class="field full"><label>Specific reason</label><textarea name="reason" required></textarea></div>
      <div class="field full"><button class="btn primary" type="submit">Submit call-off and check coverage</button></div>
    </form>
  </dialog>

  <dialog id="timeOffDialog">
    <div class="card-header">
      <div><div class="eyebrow">Hours</div><h2>Request time off</h2></div>
      <button class="btn ghost small-btn" onclick="closeDialog('timeOffDialog')">Close</button>
    </div>
    <form id="timeOffForm" class="form-grid">
      <div class="field"><label>First date</label><input name="startDate" type="date" required></div>
      <div class="field"><label>Last date</label><input name="endDate" type="date" required></div>
      <div class="field">
        <label>Hours type</label>
        <select name="type" required><option>Sick</option><option>Personal business</option><option>Holiday</option><option>Unpaid</option><option>Other</option></select>
      </div>
      <div class="field"><label class="check"><input type="checkbox" name="hasHours"> I have enough hours</label></div>
      <div class="field full"><label>Reason</label><textarea name="reason" required></textarea></div>
      <div class="field full"><button class="btn primary" type="submit">Send request</button></div>
    </form>
  </dialog>

  <dialog id="availabilityDialog">
    <div class="card-header">
      <div><div class="eyebrow">Weekly schedule</div><h2>Update availability</h2></div>
      <button class="btn ghost small-btn" onclick="closeDialog('availabilityDialog')">Close</button>
    </div>
    <form id="availabilityForm">
      <div id="availabilityDays" class="list"></div>
      <div class="dialog-actions"><button class="btn primary" type="submit">Send availability</button></div>
    </form>
  </dialog>

  <dialog id="fullScheduleDialog" class="wide-dialog">
    <div class="card-header">
      <div><div class="eyebrow">Weekly coverage</div><h2 id="fullScheduleTitle">Weekly View</h2></div>
      <div class="toolbar"><button id="refreshFullSchedule" class="btn ghost small-btn" type="button">Refresh</button><button class="btn ghost small-btn" onclick="closeDialog('fullScheduleDialog')">Close</button></div>
    </div>
    <div id="fullScheduleContent"></div>
  </dialog>

  <dialog id="benchmarkHistoryDialog">
    <div class="card-header">
      <div><div class="eyebrow">Benchmark history</div><h2 id="benchmarkHistoryTitle">Entries</h2></div>
      <button class="btn ghost small-btn" onclick="closeDialog('benchmarkHistoryDialog')">Close</button>
    </div>
    <div id="benchmarkHistoryContent"></div>
  </dialog>

  <script>
    const state = {
      data: null,
      selectedTab: 'overview',
      benchmarkResults: [],
      scheduleData: null,
      editingBenchmarkId: null,
      benchmarkStudentId: '',
      goalStudentId: '',

    function shiftScheduleDate(days) {
      const input = document.getElementById('scheduleDate');
      const date = new Date((input.value || state.data.today) + 'T12:00:00');

      input.value = date.toISOString().slice(0, 10);
      document.getElementById('scheduleTemplate').value = '';
      loadScheduleBuilder();
    }

    async function loadScheduleBuilder() {
      const date = document.getElementById('scheduleDate').value;
      if (!date) return toast('Choose a date.', true);
      try {
        state.scheduleData = await server('getScheduleBuilderData', date);
        if (!state.scheduleData || !state.scheduleData.schedule) throw new Error('The schedule response was incomplete.');
        state.scheduleData.aides = safeArray(state.scheduleData.aides);
        state.scheduleData.classes = safeArray(state.scheduleData.classes);
        state.scheduleData.oneToOneStudents = safeArray(state.scheduleData.oneToOneStudents);
        state.scheduleData.scheduleTypes = safeArray(state.scheduleData.scheduleTypes);
        state.scheduleData.training = safeArray(state.scheduleData.training);
        state.scheduleData.staffingStatus = safeArray(state.scheduleData.staffingStatus);
        state.scheduleData.unassignedOneToOnes = safeArray(state.scheduleData.unassignedOneToOnes);
        state.scheduleData.unavailable = safeArray(state.scheduleData.unavailable);
        state.scheduleData.schedule.periods = safeArray(state.scheduleData.schedule.periods);
        state.scheduleData.schedule.assignments = safeArray(state.scheduleData.schedule.assignments);
        state.scheduleData.week = normalizeWeekData(state.scheduleData.week);
        const templateId = document.getElementById('scheduleTemplate').value;
        if (templateId) {
          const template = state.scheduleData.scheduleTypes.find(item => String(item.id) === templateId);
          if (template) {
            state.scheduleData.schedule.periods = safeArray(template.periods).map(item => ({...item}));
            state.scheduleData.schedule.assignments = safeArray(template.assignments).map(item => ({...item, id: '', date}));
            state.scheduleData.schedule.baseScheduleTypeId = template.id;
            state.scheduleData.schedule.name = template.name + ' · ' + date;
          }
        }
        renderScheduleWorkspace();
        if (templateId) scheduleDraftChanged();
      } catch (error) { toast(error.message, true); }
    }

    function normalizeWeekData(value) {
      value = value && typeof value === 'object' ? value : {};
      value.days = safeArray(value.days).map(day => Object.assign({}, day || {}, {
        periods: safeArray(day && day.periods),
        assignments: safeArray(day && day.assignments),
        conflicts: safeArray(day && day.conflicts)
      }));
      value.aides = safeArray(value.aides);
      value.summary = value.summary || {};
      value.summary.aides = safeArray(value.summary.aides).map(item => Object.assign({}, item || {}, {
        byDay: safeArray(item && item.byDay)
      }));
      value.summary.overCapacity = safeArray(value.summary.overCapacity);
      value.summary.totals = value.summary.totals || {};
      return value;
    }

    function renderScheduleWeekBar(week, activeDate) {
      return `<div class="week-bar">${safeArray(week.days).map(day => {
        const totalHours = safeArray(week.summary.aides).reduce((total, aide) => {
          const record = safeArray(aide.byDay).find(item => item.date === day.date);
          return total + Number(record && record.hours || 0);
        }, 0);
        return `<button class="week-day ${day.date === activeDate ? 'active' : ''}" type="button" data-schedule-day="${escapeAttr(day.date)}">
          <strong>${escapeHtml(titleCase(day.dayName || ''))}</strong>
          <span>${escapeHtml(formatShortDate(day.date))}</span>
          <span>${escapeHtml(scheduleSourceLabel(day.source))} · ${escapeHtml(String(roundClientHours(totalHours)))} staff hrs</span>
          ${safeArray(day.conflicts).length ? `<span class="status-denied">${day.conflicts.length} conflict${day.conflicts.length === 1 ? '' : 's'}</span>` : ''}
        </button>`;
      }).join('')}</div>`;
    }

    function bindScheduleWeekDays() {
      document.querySelectorAll('[data-schedule-day]').forEach(button => button.addEventListener('click', () => {
        document.getElementById('scheduleDate').value = button.dataset.scheduleDay;
        document.getElementById('scheduleTemplate').value = '';
        loadScheduleBuilder();
      }));
    }

    function renderCapacitySummary(summary) {
      summary = summary || {};
      const aides = safeArray(summary.aides);
      return `
        ${safeArray(summary.overCapacity).length ? `<div class="message"><strong>${summary.overCapacity.length} aide${summary.overCapacity.length === 1 ? '' : 's'} above weekly capacity.</strong> Review the highlighted totals before saving.</div>` : ''}
        <div class="capacity-rail">${aides.map(item => {
          const capacity = item.capacityHours == null ? 'Not set' : item.capacityHours + ' hrs';
          const difference = item.deltaHours == null
            ? 'Add weekly hours in People'
            : (item.deltaHours > 0 ? item.deltaHours + ' over' : Math.abs(item.deltaHours) + ' remaining');
          return `<div class="capacity-item ${item.status === 'OVER' ? 'over' : ''}">
            <div class="row" style="justify-content:space-between"><strong>${escapeHtml(item.displayName || item.email)}</strong><span class="chip ${item.status === 'OVER' ? 'critical' : ''}">${escapeHtml(item.status || 'UNSET')}</span></div>
            <div class="hours">${escapeHtml(String(item.assignedHours || 0))} / ${escapeHtml(capacity)}</div>
            <div class="muted small">${escapeHtml(difference)}</div>
          </div>`;
        }).join('')}</div>`;
    }

    function scheduleSourceLabel(value) {
      return value === 'DAY' ? 'Saved day' : value === 'TEMPLATE' ? 'Template' : value === 'DRAFT' ? 'Unsaved' : 'No schedule';
    }

    function formatShortDate(value) {
      const date = new Date(String(value || '') + 'T12:00:00');
      return Number.isNaN(date.getTime())
        ? String(value || '')
        : date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function formatDateRange(start, end) {
      return `${formatShortDate(start)}–${formatShortDate(end)}`;
    }

    function roundClientHours(value) {
      return Math.round(Number(value || 0) * 100) / 100;
    }

    function scheduleDraftChanged() {
      if (!state.scheduleData || !document.getElementById('scheduleTable')) return;
      state.scheduleData.schedule.assignments = collectScheduleAssignments();
      refreshScheduleCellStatusIndicators_();
      updateScheduleHeaderHours_();
      renderScheduleCoverageAssistant();
      const button = document.getElementById('submitScheduleChanges');
      if (button) {
        button.classList.add('primary');
        button.textContent = 'Submit changes to recalculate';
      }
    }

    async function submitScheduleChanges_() {
      const summary = await previewScheduleWeek();
      if (!summary) return;
      const button = document.getElementById('submitScheduleChanges');
      if (button) {
        button.classList.remove('primary');
        button.textContent = 'Recalculate submitted draft';
      }
      toast('Draft recalculated. The schedule has not been saved.');
    }

    async function previewScheduleWeek() {
      if (!state.scheduleData || !document.getElementById('scheduleTable')) return null;
      const payload = currentSchedulePayload();
      try {
        const summary = await server('previewWeeklyHours', payload);
        state.scheduleData.week.summary = summary || {};
        const day = state.scheduleData.week.days.find(item => item.date === state.scheduleData.date);
        if (day) day.source = 'DRAFT';
        document.getElementById('scheduleCapacitySummary').innerHTML = renderCapacitySummary(summary);
        document.getElementById('scheduleWeekBar').innerHTML = renderScheduleWeekBar(state.scheduleData.week, state.scheduleData.date);
        bindScheduleWeekDays();
        renderScheduleCoverageAssistant();
        updateScheduleHeaderHours_();
        return summary;
      } catch (error) {
        toast(error.message, true);
        return null;
      }
    }

              <div class="period-editor">
                <input data-period-field="label" data-index="${periodIndex}" value="${escapeAttr(period.label)}" aria-label="Period label">
                <input data-period-field="startTime" data-index="${periodIndex}" type="time" value="${escapeAttr(period.startTime)}">
                <input data-period-field="endTime" data-index="${periodIndex}" type="time" value="${escapeAttr(period.endTime)}">
                <button class="btn danger small-btn" data-remove-period="${periodIndex}">Remove</button>
              </div>
            </td>
            ${data.aides.map(aide => renderScheduleCell(period, aide)).join('')}
          </tr>`).join('')}</tbody>`;
      table.querySelectorAll('[data-period-field]').forEach(input => input.addEventListener('input', () => {
        state.scheduleData.schedule.periods[Number(input.dataset.index)][input.dataset.periodField] = input.value;
        scheduleDraftChanged();
      }));
      table.querySelectorAll('[data-remove-period]').forEach(button => button.addEventListener('click', () => {
        const removed = state.scheduleData.schedule.periods.splice(Number(button.dataset.removePeriod), 1)[0];
        state.scheduleData.schedule.assignments = state.scheduleData.schedule.assignments
          .filter(item => String(item.periodId) !== String(removed.periodId));
        renderScheduleTable();
        scheduleDraftChanged();
      }));
      table.querySelectorAll('.schedule-cell [data-field]').forEach(input => input.addEventListener('change', () => {
        scheduleDraftChanged();
      }));
      table.querySelectorAll('[data-mark-aide-off]').forEach(button =>
        button.addEventListener('click', () => markScheduleAideOff_(button.dataset.markAideOff))
      );
      requestAnimationFrame(() => setupScheduleGridNavigation(previousScrollLeft));
      renderScheduleCoverageAssistant();
      updateScheduleHeaderHours_();
    }

    function setupScheduleGridNavigation(scrollLeft) {
      const table = document.getElementById('scheduleTable');
      const tableWrap = document.getElementById('scheduleTableWrap');
      const topScroll = document.getElementById('scheduleTopScroll');
      const topTrack = document.getElementById('scheduleTopScrollTrack');
      const leftButton = document.getElementById('scheduleScrollLeft');
      const rightButton = document.getElementById('scheduleScrollRight');
      if (!table || !tableWrap || !topScroll || !topTrack) return;

      topTrack.style.width = table.scrollWidth + 'px';
      tableWrap.scrollLeft = Number(scrollLeft || 0);
      topScroll.scrollLeft = tableWrap.scrollLeft;

      let syncing = false;
      topScroll.onscroll = () => {
        if (syncing) return;
        syncing = true;
        tableWrap.scrollLeft = topScroll.scrollLeft;
        syncing = false;
      };
      tableWrap.onscroll = () => {
        if (syncing) return;
        syncing = true;
        topScroll.scrollLeft = tableWrap.scrollLeft;
        syncing = false;
      };

      const scrollDistance = () => Math.max(320, Math.round(tableWrap.clientWidth * .7));
      if (leftButton) leftButton.onclick = () => tableWrap.scrollBy({ left: -scrollDistance(), behavior: 'smooth' });
      if (rightButton) rightButton.onclick = () => tableWrap.scrollBy({ left: scrollDistance(), behavior: 'smooth' });
    }

    function renderScheduleCell(period, aide) {
      const assignment = state.scheduleData.schedule.assignments.find(item =>
        String(item.periodId) === String(period.periodId) && normalizeEmail(item.aideEmail) === normalizeEmail(aide.email)
      ) || {};
      const status = scheduleCellStatus(aide.email, period);
      const key = encodeURIComponent(period.periodId + '|' + aide.email);
      return `<td class="schedule-assignment-cell ${escapeAttr(status.level)}">
        <div class="schedule-cell" data-cell="${key}" data-period-id="${escapeAttr(period.periodId)}" data-aide-email="${escapeAttr(aide.email)}">
          ${status.blockingReason ? `<div class="schedule-cell-alert blocked">${escapeHtml(status.blockingReason)}</div>` : ''}
          ${!status.blockingReason && status.warningReason ? `<div class="schedule-cell-alert warning">${escapeHtml(status.warningReason)}</div>` : ''}
          <select data-field="classId"><option value="">No class</option>${options(state.scheduleData.classes, 'id', 'name', assignment.classId)}</select>
          <select data-field="studentId"><option value="">No 1:1</option>${options(state.scheduleData.oneToOneStudents, 'id', 'name', assignment.studentId)}</select>
          <input data-field="duty" placeholder="Duty / OFF" value="${escapeAttr(assignment.duty || '')}">
          <input data-field="note" placeholder="Note" value="${escapeAttr(assignment.note || '')}">
        </div>
      </td>`;
    }

    function renderScheduleAideHeader(aide) {
      const status = scheduleCellStatus(aide.email, null);
      const hours = scheduleLiveHoursForAide_(aide.email, safeArray(state.scheduleData.schedule.assignments));
      const availability = status.availabilityLabel
        ? `<div class="muted">${escapeHtml(status.availabilityLabel)}</div>`
        : '';
      const badge = status.blockingReason
        ? `<span class="chip status-denied">${escapeHtml(status.shortLabel)}</span>`
        : (status.warningReason ? `<span class="chip status-pending">Pending request</span>` : '');
      return `<th>${escapeHtml(aide.displayName)}<div class="muted">${escapeHtml(aide.email)}</div><div class="schedule-header-hours" data-aide-hours="${escapeAttr(aide.email)}">${scheduleHeaderHoursMarkup_(hours)}</div>${availability}${badge}<button class="btn danger small-btn schedule-aide-off" type="button" data-mark-aide-off="${escapeAttr(aide.email)}" aria-label="Mark ${escapeAttr(aide.displayName)} off for all periods">Mark off</button></th>`;
    }

    function markScheduleAideOff_(email) {
      const aide = safeArray(state.scheduleData && state.scheduleData.aides)
        .find(item => normalizeEmail(item.email) === normalizeEmail(email));
      const displayName = aide ? aide.displayName : email;
      if (!confirm(`Mark ${displayName} OFF for every period? Their class, 1:1, duty, and note assignments will be cleared from this draft.`)) return;
      document.querySelectorAll('.schedule-cell').forEach(cell => {
        if (normalizeEmail(cell.dataset.aideEmail) !== normalizeEmail(email)) return;
        cell.querySelectorAll('[data-field]').forEach(input => {
          input.value = input.dataset.field === 'duty' ? 'OFF' : '';
        });
      });
      scheduleDraftChanged();
      toast(`${displayName} is marked OFF for every period in this draft.`);
    }

    function refreshScheduleCellStatusIndicators_() {
      document.querySelectorAll('.schedule-cell').forEach(cell => {
        const period = safeArray(state.scheduleData.schedule.periods)
          .find(item => String(item.periodId) === String(cell.dataset.periodId));
        const status = scheduleCellStatus(cell.dataset.aideEmail, period);
        const tableCell = cell.closest('td');
        if (tableCell) {
          tableCell.classList.remove('blocked', 'warning', 'available');
          tableCell.classList.add(status.level);
        }
        cell.querySelectorAll(':scope > .schedule-cell-alert').forEach(alert => alert.remove());
        if (status.blockingReason) {
          cell.insertAdjacentHTML('afterbegin', `<div class="schedule-cell-alert blocked">${escapeHtml(status.blockingReason)}</div>`);
        } else if (status.warningReason) {
          cell.insertAdjacentHTML('afterbegin', `<div class="schedule-cell-alert warning">${escapeHtml(status.warningReason)}</div>`);
        }
      });
    }

    function updateScheduleHeaderHours_() {
      if (!state.scheduleData) return;
      const assignments = document.getElementById('scheduleTable')
        ? collectScheduleAssignments()
        : safeArray(state.scheduleData.schedule.assignments);
      document.querySelectorAll('[data-aide-hours]').forEach(element => {
        element.innerHTML = scheduleHeaderHoursMarkup_(
          scheduleLiveHoursForAide_(element.dataset.aideHours, assignments)
        );
      });
    }

    function scheduleHeaderHoursMarkup_(hours) {
      const capacity = hours.capacityHours == null ? '' : `/${roundClientHours(hours.capacityHours)}`;
      return `Day ${roundClientHours(hours.dailyHours)} hrs · Week ${roundClientHours(hours.weeklyHours)}${capacity} hrs${hours.lunchDeducted ? '<div class="muted">0.5 hr lunch deducted</div>' : ''}`;
    }

    function scheduleLiveHoursForAide_(email, assignments) {
      const intervals = safeArray(assignments)
        .filter(item => normalizeEmail(item.aideEmail) === normalizeEmail(email))
        .filter(item => {
          if (String(item.type || '').toUpperCase() === 'OFF') return false;
          if (String(item.duty || '').trim().toUpperCase() === 'OFF') return false;
          return Boolean(item.classId || item.studentId || String(item.duty || '').trim() || String(item.note || '').trim());
        })
        .map(item => {
          const period = safeArray(state.scheduleData.schedule.periods)
            .find(row => String(row.periodId) === String(item.periodId));
          return period ? [scheduleTimeToMinutes_(period.startTime), scheduleTimeToMinutes_(period.endTime)] : null;
        })
        .filter(item => item && item[0] >= 0 && item[1] > item[0])
        .sort((a, b) => a[0] - b[0]);
      const merged = [];
      intervals.forEach(interval => {
        const current = merged[merged.length - 1];
        if (current && interval[0] <= current[1]) current[1] = Math.max(current[1], interval[1]);
        else merged.push(interval.slice());
      });
      const grossHours = roundClientHours(
        merged.reduce((total, interval) => total + interval[1] - interval[0], 0) / 60
      );
      const lunchDeducted = grossHours > 5;
      const dailyHours = roundClientHours(grossHours - (lunchDeducted ? .5 : 0));
      const summary = safeArray(state.scheduleData.week && state.scheduleData.week.summary && state.scheduleData.week.summary.aides)
        .find(item => normalizeEmail(item.email) === normalizeEmail(email)) || {};
      const priorDay = safeArray(summary.byDay)
        .find(item => String(item.date) === String(state.scheduleData.date));
      const weeklyHours = roundClientHours(
        Number(summary.assignedHours || 0) - Number(priorDay && priorDay.hours || 0) + dailyHours
      );
      const aide = safeArray(state.scheduleData.aides)
        .find(item => normalizeEmail(item.email) === normalizeEmail(email)) || {};
      return {
        dailyHours: dailyHours,
        weeklyHours: weeklyHours,
        capacityHours: aide.weeklyHours == null ? null : Number(aide.weeklyHours),
        lunchDeducted: lunchDeducted
      };
    }

    function scheduleTimeToMinutes_(value) {
      const match = String(value || '').match(/^(\d{1,2}):(\d{2})$/);
      if (!match) return -1;
      const hours = Number(match[1]);
      const minutes = Number(match[2]);
      return hours >= 0 && hours < 24 && minutes >= 0 && minutes < 60
        ? hours * 60 + minutes
        : -1;
    }

    function scheduleCellStatus(email, period) {
      const staffing = safeArray(state.scheduleData && state.scheduleData.staffingStatus)
        .find(item => normalizeEmail(item.email) === normalizeEmail(email)) || {};
      const approvedAvailability = staffing.approvedAvailability || null;
      let blockingReason = '';
      let warningReason = '';
      let shortLabel = '';
      if (staffing.approvedTimeOff) {
        blockingReason = 'Approved time off: ' + (staffing.approvedTimeOff.type || 'Time off');
        shortLabel = 'Time off';
      } else if (approvedAvailability && !approvedAvailability.available) {
        blockingReason = 'Not available';
        shortLabel = 'Unavailable';
      } else if (period && approvedAvailability && approvedAvailability.available &&
          (approvedAvailability.startTime > period.startTime || approvedAvailability.endTime < period.endTime)) {
        blockingReason = `Outside approved hours (${approvedAvailability.startTime}–${approvedAvailability.endTime})`;
        shortLabel = 'Outside hours';
      }
      if (staffing.pendingTimeOff) {
        warningReason = 'Pending time off: ' + (staffing.pendingTimeOff.type || 'Time off');
      } else if (staffing.pendingAvailability) {
        warningReason = 'Pending availability change';
      }
      return {
        level: blockingReason ? 'blocked' : (warningReason ? 'warning' : 'available'),
        blockingReason: blockingReason,
        warningReason: warningReason,
        shortLabel: shortLabel,
        availabilityLabel: approvedAvailability && approvedAvailability.available
          ? `Available ${approvedAvailability.startTime}–${approvedAvailability.endTime}`
          : ''
      };
    }

    function renderScheduleCoverageAssistant() {
      const root = document.getElementById('scheduleCoverageAssistant');
      const count = document.getElementById('scheduleCoverageCount');
      if (!root || !state.scheduleData) return;
      const assignments = document.getElementById('scheduleTable')
        ? collectScheduleAssignments()
        : safeArray(state.scheduleData.schedule.assignments);
      const conflicts = assignments
        .map(assignment => {
          const period = safeArray(state.scheduleData.schedule.periods)
            .find(item => String(item.periodId) === String(assignment.periodId));
          const status = scheduleCellStatus(assignment.aideEmail, period);
          return status.blockingReason ? { assignment, period, status } : null;
        })
        .filter(Boolean);
      const pending = assignments
        .map(assignment => {
          const period = safeArray(state.scheduleData.schedule.periods)
            .find(item => String(item.periodId) === String(assignment.periodId));
          const status = scheduleCellStatus(assignment.aideEmail, period);
          return !status.blockingReason && status.warningReason ? { assignment, period, status } : null;
        })
        .filter(Boolean);
      const gaps = safeArray(state.scheduleData.unassignedOneToOnes).filter(gap =>
        !assignments.some(item =>
          String(item.periodId) === String(gap.periodId) &&
          String(item.studentId) === String(gap.studentId) &&
          String(item.type || '').toUpperCase() !== 'OFF'
        )
      );
      const issues = conflicts.length + gaps.length;
      count.textContent = String(issues);
      count.className = 'chip' + (issues ? ' critical' : '');
      const items = [];
      gaps.forEach(gap => items.push(renderScheduleCoverageIssue_({
        label: gap.name,
        reason: 'No aide assigned',
        studentId: gap.studentId,
        periodId: gap.periodId,
        sourceEmail: ''
      }, assignments)));
      conflicts.forEach(item => {
        const aide = safeArray(state.scheduleData.aides)
          .find(row => normalizeEmail(row.email) === normalizeEmail(item.assignment.aideEmail));
        items.push(renderScheduleCoverageIssue_({
          label: `${aide ? aide.displayName : item.assignment.aideEmail} · ${item.period ? item.period.label : item.assignment.periodId}`,
          reason: item.status.blockingReason,
          studentId: item.assignment.studentId || '',
          periodId: item.assignment.periodId,
          sourceEmail: item.assignment.aideEmail
        }, assignments));
      });
      if (pending.length) {
        items.push(`<div class="coverage-assistant-item">
          <strong>Pending requests to monitor</strong>
          <div class="muted small">${pending.map(item => {
            const aide = safeArray(state.scheduleData.aides)
              .find(row => normalizeEmail(row.email) === normalizeEmail(item.assignment.aideEmail));
            return escapeHtml(`${aide ? aide.displayName : item.assignment.aideEmail} · ${item.period ? item.period.label : item.assignment.periodId} — ${item.status.warningReason}`);
          }).join('<br>')}</div>
        </div>`);
      }
      root.innerHTML = items.length
        ? items.join('')
        : '<span class="muted">No availability conflicts or 1:1 coverage gaps are detected.</span>';
      root.querySelectorAll('[data-apply-replacement]').forEach(button =>
        button.addEventListener('click', () => applyScheduleReplacement_(button))
      );
    }

    function renderScheduleCoverageIssue_(issue, assignments) {
      const candidates = scheduleReplacementCandidates_(issue, assignments).slice(0, 3);
      return `<div class="coverage-assistant-item blocked">
        <div><strong>${escapeHtml(issue.label)}</strong><div class="muted small">${escapeHtml(issue.reason)}</div></div>
        <div class="replacement-options">${candidates.length ? candidates.map(candidate => `
          <button class="btn ghost small-btn" type="button" data-apply-replacement
            data-period-id="${escapeAttr(issue.periodId)}"
            data-student-id="${escapeAttr(issue.studentId)}"
            data-source-email="${escapeAttr(issue.sourceEmail)}"
            data-target-email="${escapeAttr(candidate.email)}">
            Use ${escapeHtml(candidate.displayName)} · ${escapeHtml(candidate.remainingLabel)}
          </button>`).join('') : `<span class="muted small">No available ${issue.studentId ? 'trained ' : ''}replacement is currently open for this period.</span>`}</div>
      </div>`;
    }

    function scheduleReplacementCandidates_(issue, assignments) {
      const training = safeArray(state.scheduleData.training);
      const period = safeArray(state.scheduleData.schedule.periods)
        .find(item => String(item.periodId) === String(issue.periodId));
      return safeArray(state.scheduleData.aides)
        .filter(aide => normalizeEmail(aide.email) !== normalizeEmail(issue.sourceEmail))
        .filter(aide => !assignments.some(item =>
          String(item.periodId) === String(issue.periodId) &&
          normalizeEmail(item.aideEmail) === normalizeEmail(aide.email)
        ))
        .filter(aide => !issue.studentId || training.some(item =>
          normalizeEmail(item.aideEmail) === normalizeEmail(aide.email) &&
          String(item.studentId) === String(issue.studentId)
        ))
        .map(aide => {
          const status = scheduleCellStatus(aide.email, period);
          const liveHours = scheduleLiveHoursForAide_(aide.email, assignments);
          const remaining = liveHours.capacityHours == null
            ? null
            : liveHours.capacityHours - liveHours.weeklyHours;
          return {
            email: aide.email,
            displayName: aide.displayName,
            blocked: Boolean(status.blockingReason),
            warning: Boolean(status.warningReason),
            remaining: remaining,
            remainingLabel: remaining == null
              ? 'hours not set'
              : `${Math.round(remaining * 100) / 100} hrs remaining${status.warningReason ? ' · pending request' : ''}`
          };
        })
        .filter(item => !item.blocked)
        .sort((a, b) =>
          Number(a.warning) - Number(b.warning) ||
          (b.remaining == null ? -Infinity : b.remaining) - (a.remaining == null ? -Infinity : a.remaining) ||
          a.displayName.localeCompare(b.displayName)
        );
    }

    function applyScheduleReplacement_(button) {
      const periodId = button.dataset.periodId;
      const sourceEmail = button.dataset.sourceEmail;
      const targetEmail = button.dataset.targetEmail;
      const cells = Array.from(document.querySelectorAll('.schedule-cell'));
      const target = cells.find(cell =>
        String(cell.dataset.periodId) === String(periodId) &&
        normalizeEmail(cell.dataset.aideEmail) === normalizeEmail(targetEmail)
      );
      if (!target) return toast('The replacement cell was not found.', true);
      const source = sourceEmail ? cells.find(cell =>
        String(cell.dataset.periodId) === String(periodId) &&
        normalizeEmail(cell.dataset.aideEmail) === normalizeEmail(sourceEmail)
      ) : null;
      if (source) {
        source.querySelectorAll('[data-field]').forEach(input => {
          const targetInput = target.querySelector(`[data-field="${input.dataset.field}"]`);
          if (targetInput) targetInput.value = input.value;
          input.value = '';
        });
      } else {
        const student = target.querySelector('[data-field="studentId"]');
        if (student) student.value = button.dataset.studentId;
      }
      state.scheduleData.schedule.assignments = collectScheduleAssignments();
      scheduleDraftChanged();
    }

    async function saveScheduleFromGrid() {
      const payload = currentSchedulePayload();
      try {
        const summary = await server('previewWeeklyHours', payload);
        const overCapacity = safeArray(summary && summary.overCapacity);
        if (overCapacity.length) {
          const details = overCapacity.map(item =>
            `${item.displayName}: ${item.assignedHours}/${item.capacityHours} hours`
          ).join('\n');
          if (!confirm('This schedule places staff above weekly capacity:\n\n' + details + '\n\nSave anyway?')) return;
        }
        const result = await server('saveSchedule', payload);
        const warnings = safeArray(result.warnings);
        toast(warnings.length ? 'Saved with warnings: ' + warnings.join(' ') : 'Schedule saved.');
        await loadScheduleBuilder();
      } catch (error) { toast(error.message, true); }
    }

    function currentSchedulePayload() {
      return {
        id: state.scheduleData.schedule.id,
        date: state.scheduleData.date,
        name: document.getElementById('scheduleName').value,
        baseScheduleTypeId: document.getElementById('scheduleBase').value,
        temporary: true,
        periods: state.scheduleData.schedule.periods,
        assignments: collectScheduleAssignments()
      };
    }

    async function saveCurrentAsScheduleType() {
      const name = prompt('Name this reusable schedule type:');
      if (!name) return;
      try {
        await server('saveScheduleType', {
          name,
          isDefault: confirm('Make this the default schedule when no daily schedule exists?'),
          periods: state.scheduleData.schedule.periods,
          assignments: collectScheduleAssignments()
        });
        state.data = normalizeBootstrap(await server('getAppBootstrap'));
        state.scheduleData.scheduleTypes = state.data.caseManager.scheduleTypes;
        toast('Schedule type saved.');
      } catch (error) { toast(error.message, true); }

    function collectScheduleAssignments() {
      return Array.from(document.querySelectorAll('.schedule-cell')).map(cell => {
        const values = {};
        cell.querySelectorAll('[data-field]').forEach(input => values[input.dataset.field] = input.value);

        return {
          periodId: cell.dataset.periodId,
          aideEmail: cell.dataset.aideEmail,
          classId: values.classId,
          studentId: values.studentId,
          duty: values.duty,
          note: values.note,
          type: String(values.duty || '').toUpperCase() === 'OFF' ? 'OFF' : (values.studentId ? 'ONE_TO_ONE' : 'STANDARD')
        };
      }).filter(Boolean);
    }

    function parseGoalObjectivesClient(value) {
      const text = String(value || '').trim();
      const marker = /short\s*[-–—]?\s*term\s+objective\b\s*[:\-–—]?\s*/gi;
      const matches = [];
      let match;
      while ((match = marker.exec(text)) !== null) {
        matches.push({ index: match.index, end: marker.lastIndex });
      }
      if (!matches.length) throw new Error('Add three “Short-Term Objective” headings.');
      if (matches.length !== 3) {
        throw new Error('Each goal must contain exactly three short-term objectives.');
      }
      return matches.map((item, index) => {
        const end = matches[index + 1] ? matches[index + 1].index : text.length;
        const objective = text.slice(item.end, end).replace(/^[\s:;#\d.)\]-]+/, '').trim();
        if (!objective) throw new Error(`Short-Term Objective ${index + 1} has no text.`);
        const ratios = [];
        const ratioPattern = /(\d+)\s*(?:\/|out\s+of)\s*(\d+)/gi;
        let ratio;
        while ((ratio = ratioPattern.exec(objective)) !== null) {
          const numerator = Number(ratio[1]);
          const denominator = Number(ratio[2]);
          if (denominator <= 0 || numerator < 0 || numerator > denominator) {
            throw new Error(`Short-Term Objective ${index + 1} has an invalid ratio.`);
          }
          ratios.push({ numerator, denominator });
        }
        if (!ratios.length) {
          throw new Error(`Short-Term Objective ${index + 1} needs a ratio such as 4/5 or 4 out of 5.`);
        }
        return {
          index,
          text: objective,
          metric: `${ratios[0].numerator}/${ratios[0].denominator}` +
            (ratios[1] ? ` in ${ratios[1].numerator}/${ratios[1].denominator} trials` : '')
        };
      });
    }

      const currentClass = classes.find(item => String(item.id) === String(context.currentClassId)) ||
        classes.find(item => normalizeEmail(item.teacherEmail) === normalizeEmail(state.data.user.email));
      const selectedTeacher = currentClass ? currentClass.teacherEmail : (teachers[0] ? teachers[0].email : '');
      state.lookupClassId = currentClass ? currentClass.id : '';
      return `
        <div class="card-header">
          <div><div class="eyebrow">Primary workflow</div><h2>Benchmark lookup and input</h2><p class="muted">Your current assignment is selected when available. Choose another teacher and period to override it.</p></div>
          <button class="btn ghost small-btn" type="button" data-refresh="${escapeAttr(state.selectedTab)}">Refresh</button>
        </div>
        <div class="form-grid three">
          <div class="field"><label>Teacher</label><select id="lookupTeacher"><option value="">Select a teacher</option>${options(teachers, 'email', 'displayName', selectedTeacher)}</select></div>
          <div class="field"><label>Period</label><select id="lookupPeriod"><option value="">Select a period</option></select></div>
          <div class="field"><label>Subject</label><div id="lookupSubject" class="check muted">Select a teacher and period.</div></div>
          <div class="field full"><label>Students</label><div id="lookupStudents" class="checks"><span class="muted small">Select a teacher and period first.</span></div></div>
          <div class="field full section-tools"><div id="lookupAssignmentNote" class="muted small"></div><button id="lookupButton" class="btn primary" type="button">Find relevant benchmarks</button></div>
        </div>`;
    }

    function bindBenchmarkLookup() {
      const teacher = document.getElementById('lookupTeacher');
      const period = document.getElementById('lookupPeriod');
      const button = document.getElementById('lookupButton');
      if (!teacher || !period || !button) return;
      teacher.addEventListener('change', () => populateLookupPeriods(''));
      period.addEventListener('change', renderLookupStudents);
      button.addEventListener('click', lookupBenchmarks);
      bindRefreshButtons(document);
      populateLookupPeriods(state.lookupClassId);
    }

    function populateLookupPeriods(preferredClassId) {
      const context = state.data.benchmarkLookup || {};
      const teacher = document.getElementById('lookupTeacher');
      const period = document.getElementById('lookupPeriod');
      if (!teacher || !period) return;
      const classes = safeArray(context.classes).filter(item => normalizeEmail(item.teacherEmail) === normalizeEmail(teacher.value));
      period.innerHTML = '<option value="">Select a period</option>' + classes.map(item =>
        `<option value="${escapeAttr(item.id)}" ${String(item.id) === String(preferredClassId) ? 'selected' : ''}>${escapeHtml(String(item.periodId) + ' · ' + item.name + ' · ' + item.subjectName)}</option>`
      ).join('');
      if (!period.value && classes.length === 1) period.value = classes[0].id;
      renderLookupStudents();
    }

    function renderLookupStudents() {
      const context = state.data.benchmarkLookup || {};
      const classId = document.getElementById('lookupPeriod')?.value || '';
      const root = document.getElementById('lookupStudents');
      const subject = document.getElementById('lookupSubject');
      const note = document.getElementById('lookupAssignmentNote');
      if (!root || !subject || !note) return;
      state.lookupClassId = classId;
      const selectedClass = safeArray(context.classes).find(item => String(item.id) === String(classId));
      if (!selectedClass) {
        subject.textContent = 'Select a teacher and period.';
        root.innerHTML = '<span class="muted small">Select a teacher and period first.</span>';
        note.textContent = '';
        return;
      }
      subject.textContent = selectedClass.subjectName || 'No subject assigned';
      const currentStudentId = String(classId) === String(context.currentClassId) ? context.currentStudentId : '';
      const students = safeArray(selectedClass.students);
      root.innerHTML = students.length ? students.map(item => `
        <label class="check"><input type="checkbox" value="${escapeAttr(item.id)}" ${String(item.id) === String(currentStudentId) ? 'checked' : ''}> ${escapeHtml(item.name)}</label>`).join('')
        : '<span class="muted small">No students are enrolled in this class.</span>';
      note.textContent = String(classId) === String(context.currentClassId)
        ? 'Using your current assignment.'
        : (context.currentClassId ? 'Manual override from your current assignment.' : 'No current assignment was found; choose a class manually.');
    }

    async function lookupBenchmarks() {
      const classId = document.getElementById('lookupPeriod')?.value || '';
      const studentIds = Array.from(document.querySelectorAll('#lookupStudents input:checked')).map(input => input.value);
      if (!classId || !studentIds.length) return toast('Choose a teacher, period, and at least one student.', true);
      try {
        state.benchmarkResults = await server('lookupBenchmarks', { classId, studentIds });
        renderBenchmarkResults();
      } catch (error) { toast(error.message, true); }
    }

    function renderBenchmarkResults() {
      const root = document.getElementById('benchmarkResults');
      if (!root) return;
      const results = safeArray(state.benchmarkResults);
      root.innerHTML = results.length ? results.map(item => `
        <div class="benchmark-card" data-benchmark-card="${escapeAttr(item.id)}">
          <div>
            <div class="row">${item.critical ? '<span class="chip critical">Critical</span>' : ''}<span class="chip">${escapeHtml(item.subjectName)}</span></div>
            <h3 style="margin-top:12px">${escapeHtml(item.studentName)}</h3>
            <div>${escapeHtml(item.display)}</div>
            ${item.description ? `<p class="muted" style="margin-top:8px">${escapeHtml(item.description)}</p>` : ''}
            <div class="small muted">${item.entryCount} inputs${item.lastEntry ? ' · Last ' + escapeHtml(String(item.lastEntry.percent)) + '%' : ''}</div>
          </div>
          <form class="benchmark-entry-form">
            <input type="hidden" name="benchmarkId" value="${escapeAttr(item.id)}">
            <input type="hidden" name="classId" value="${escapeAttr(state.lookupClassId)}">
            <div class="score-grid">
              <div class="field"><label>Correct</label><input name="correct" type="number" min="0" required></div>
              <div class="field"><label>Questions</label><input name="attempts" type="number" min="1" required></div>
            </div>
            <div class="field" style="margin-top:8px"><label>Notes</label><input name="notes"></div>
            <button class="btn primary" style="margin-top:10px;width:100%">Save input</button>
          </form>
        </div>`).join('') : '<div class="empty">No active benchmarks match this class subject and student selection.</div>';
      root.querySelectorAll('.benchmark-entry-form').forEach(form => form.addEventListener('submit', async event => {
        event.preventDefault();
        const payload = formObject(event.currentTarget);
        payload.correct = Number(payload.correct);
        payload.attempts = Number(payload.attempts);
        try {
          const result = await server('saveBenchmarkEntry', payload);
          event.currentTarget.reset();
          toast('Saved: ' + result.percent + '%');
          const selectedClass = document.getElementById('lookupPeriod')?.value || '';
          const selectedStudents = Array.from(document.querySelectorAll('#lookupStudents input:checked')).map(input => input.value);
          if (selectedClass && selectedStudents.length) {
            state.benchmarkResults = await server('lookupBenchmarks', { classId: selectedClass, studentIds: selectedStudents });
            renderBenchmarkResults();
          }
        } catch (error) { toast(error.message, true); }
      }));
    }

    async function toggleClock() {
      const isClockedIn = Boolean(state.data.aide.openTimeEntry);
      try {
        await server(isClockedIn ? 'clockOut' : 'clockIn', '');
        await refreshBootstrap();
        toast(isClockedIn ? 'Clocked out.' : 'Clocked in.');
      } catch (error) { toast(error.message, true); }
    }

    async function showWeeklySchedule() {
      try {
        state.aideWeekDate = state.aideWeekDate || state.data.today;
        state.fullScheduleDate = state.fullScheduleDate || state.data.today;
        const week = await server('getAideWeek', state.aideWeekDate);
        if (!week || typeof week !== 'object') throw new Error('The weekly schedule response was incomplete.');
        week.days = safeArray(week.days).map(day => Object.assign({}, day || {}, {
          periods: safeArray(day && day.periods),
          conflicts: safeArray(day && day.conflicts)
        }));
        document.getElementById('fullScheduleTitle').textContent =
          'Weekly View · ' + formatDateRange(week.weekStart, week.weekEnd);
        document.getElementById('fullScheduleContent').innerHTML = `
          <div class="toolbar" style="justify-content:space-between;margin-bottom:16px">
            <div class="toolbar">
              <button id="previousAideWeek" class="btn ghost small-btn" type="button">Previous week</button>
              <button id="nextAideWeek" class="btn ghost small-btn" type="button">Next week</button>
            </div>
            <div class="list-item">
              <div class="eyebrow">Assigned capacity</div>
              <strong>${escapeHtml(String(week.assignedHours || 0))} / ${week.capacityHours == null ? 'Not set' : escapeHtml(String(week.capacityHours)) + ' hours'}</strong>
              ${week.status === 'OVER' ? `<div class="status-denied small">${escapeHtml(String(week.deltaHours))} hours over capacity</div>` : ''}
            </div>
          </div>
          <div class="list">${week.days.map(day => `
            <details class="week-day-schedule" ${day.date === state.data.today ? 'open' : ''}>
              <summary>${escapeHtml(titleCase(day.dayName))} · ${escapeHtml(formatShortDate(day.date))} · ${escapeHtml(String(day.hours || 0))} hours · ${escapeHtml(scheduleSourceLabel(day.source))}</summary>
              <div class="schedule-strip">${day.periods.length ? day.periods.map(period => `
                <div class="schedule-row">
                  <div><strong>${escapeHtml(period.label)}</strong><div class="muted small">${escapeHtml(period.startTime)}–${escapeHtml(period.endTime)}</div></div>
                  <div>${period.assignment ? `<strong>${escapeHtml(period.assignment.duty || period.assignment.className || 'Assignment')}</strong>${period.assignment.studentName ? `<div class="muted small">${escapeHtml(period.assignment.studentName)}</div>` : ''}` : '<span class="muted">No assignment</span>'}</div>
                </div>`).join('') : '<div class="empty">No schedule for this day.</div>'}</div>
            </details>`).join('')}</div>
          <article class="card" style="margin-top:18px">
            <div class="card-header">
              <div><div class="eyebrow">All aides</div><h2>Full daily schedule</h2></div>
              <div class="toolbar"><input id="allAidesScheduleDate" type="date" value="${escapeAttr(state.fullScheduleDate)}"><button id="loadAllAidesSchedule" class="btn small-btn" type="button">Load day</button></div>
            </div>
            <div id="allAidesScheduleContent"><div class="empty">Loading daily coverage…</div></div>
          </article>`;
        document.getElementById('previousAideWeek').addEventListener('click', () => shiftAideWeek(-7));
        document.getElementById('nextAideWeek').addEventListener('click', () => shiftAideWeek(7));
        document.getElementById('loadAllAidesSchedule').addEventListener('click', loadAllAidesSchedule);
        const dialog = document.getElementById('fullScheduleDialog');
        if (!dialog.open) openDialog('fullScheduleDialog');
        await loadAllAidesSchedule();
      } catch (error) { toast(error.message, true); }
    }

    function shiftAideWeek(days) {
      const date = new Date((state.aideWeekDate || state.data.today) + 'T12:00:00');
      date.setDate(date.getDate() + days);
      state.aideWeekDate = date.toISOString().slice(0, 10);
      showWeeklySchedule();
    }

    async function loadAllAidesSchedule() {
      const input = document.getElementById('allAidesScheduleDate');
      if (!input || !input.value) return;
      state.fullScheduleDate = input.value;
      try {
        const schedule = await server('getFullSchedule', state.fullScheduleDate);
        schedule.periods = safeArray(schedule && schedule.periods);
        schedule.assignments = safeArray(schedule && schedule.assignments);
        const root = document.getElementById('allAidesScheduleContent');
        if (!root) return;
        root.innerHTML = schedule.periods.length ? schedule.periods.map(period => {
          const assignments = schedule.assignments.filter(item => String(item.periodId) === String(period.periodId));
          return `<div class="list-item" style="margin-bottom:10px">
            <div class="row" style="justify-content:space-between"><strong>${escapeHtml(period.label)}</strong><span class="muted small">${escapeHtml(period.startTime)}–${escapeHtml(period.endTime)}</span></div>
            <div class="list" style="margin-top:10px">${assignments.length ? assignments.map(item => `
              <div><strong>${escapeHtml(item.aideName)}</strong> · ${escapeHtml(item.duty || item.className || 'Assignment')}${item.studentName ? ' · ' + escapeHtml(item.studentName) : ''}</div>`).join('') : '<span class="muted">No assignments</span>'}</div>
          </div>`;
        }).join('') : '<div class="empty">No schedule for this day.</div>';
      } catch (error) { toast(error.message, true); }
    }

    function bindStaticForms() {
      document.getElementById('refreshFullSchedule').addEventListener('click', showWeeklySchedule);
      document.getElementById('callOffForm').addEventListener('submit', async event => {
        event.preventDefault();
        const payload = formObject(event.currentTarget);
        payload.hasHours = payload.hasHours === 'true';
        try {
          const result = await server('callOff', payload);
          closeDialog('callOffDialog');
          event.currentTarget.reset();
          await refreshBootstrap();
          toast(safeArray(result.reconciliation).map(item => item.message).filter(Boolean).join(' ') || 'Call-off submitted.');
        } catch (error) { toast(error.message, true); }
      });
      document.getElementById('timeOffForm').addEventListener('submit', async event => {
        event.preventDefault();
        const payload = formObject(event.currentTarget);
        payload.hasHours = event.currentTarget.elements.hasHours.checked;
        try {
          await server('submitTimeOffRequest', payload);
          closeDialog('timeOffDialog');
          event.currentTarget.reset();
          toast('Time-off request sent.');
        } catch (error) { toast(error.message, true); }
      });
      document.getElementById('availabilityForm').addEventListener('submit', async event => {
        event.preventDefault();
        const days = Array.from(document.querySelectorAll('.availability-day')).map(row => {
          const available = row.querySelector('[data-available]').checked;
          return {
            dayOfWeek: row.dataset.day,

            startTime: row.querySelector('[data-start]').value,

          };

    function renderAvailabilityDays() {
      const days = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY'];
      document.getElementById('availabilityDays').innerHTML = days.map(day => `
        <div class="list-item availability-day" data-day="${day}">
          <div class="row" style="justify-content:space-between"><strong>${titleCase(day)}</strong><label class="check"><input data-available type="checkbox" checked> Available</label></div>
          <div class="form-grid" style="margin-top:10px"><div class="field"><label>Start</label><input data-start type="time" value="07:30"></div><div class="field"><label>End</label><input data-end type="time" value="15:30"></div></div>
        </div>`).join('');
